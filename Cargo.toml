[package]
name = "pm-sysd-w"
version = "0.1.0-a1"
edition = "2024"
license = "MIT"
autobins = false

authors = ["secext2022 <secext2022@outlook.com>"]
description = "胖喵稳哒: Systemd style on Windows."
repository = "https://github.com/fm-elpac/pm-sysd-w"
keywords = ["systemd", "service", "process", "windows", "manager"]
categories = ["command-line-utilities"]

[dependencies]
pm-bin = { version = "^0.2.1", optional = true }
pm-tc = { version = "0.1.0-a3", default-features = false, features = ["task"] }

log = "^0.4.35"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
tokio = { version = "^1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "signal", "time"] }
rusqlite = { version = "^0.41.1", features = ["bundled"] }
chrono = "^0.4.45"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "^0.62.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
pm-bin = { version = "^0.2.1", features = ["build"], optional = true }

[features]
default = []
cli = ["dep:pm-bin"]
# pm-sysd-init
cli_init = ["cli"]
# pm-sysd-ctl
cli_ctl = ["cli"]
# pm-sysd-log
cli_log = ["cli"]

[[bin]]
name = "pm-sysd-init"
path = "src/bin/pm-sysd-init.rs"
required-features = ["cli_init"]

[[bin]]
name = "pm-sysd-ctl"
path = "src/bin/pm-sysd-ctl.rs"
required-features = ["cli_ctl"]

[[bin]]
name = "pm-sysd-log"
path = "src/bin/pm-sysd-log.rs"
required-features = ["cli_log"]

[profile.release]
strip = true
lto = true
